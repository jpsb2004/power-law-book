name: Daily refresh

# Feeds the published page from public market data without a machine of the
# user's needing to be switched on.
#
# GitHub cron is UTC and has no DST. 22:00 UTC is two hours after the US close
# (16:00 ET), by which point every exchange in the book has settled. Scheduled
# runs can start late when GitHub's queue is busy; harmless here, since the job
# snapshots a daily close rather than an intraday moment.
on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch: # trigger a refresh by hand from the Actions tab

permissions:
  contents: write # commit the refreshed snapshot + history back
  pages: write # publish to GitHub Pages
  id-token: write # required by deploy-pages

# Never let two refreshes interleave: both write data/snapshot.json, and the
# validator compares each candidate against it.
concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.refresh.outputs.status }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: npm ci

      - run: pip install -r requirements.txt

      # Guards the roster before anything fetches or publishes: counts must
      # agree across positions.json, holdings.js and the last snapshot, and
      # bucket weights must still land on 38/32/30.
      - name: Check book invariants
        run: node scripts/check-book.mjs

      - name: Fetch and validate daily closes
        id: refresh
        run: |
          set +e
          node scripts/refresh.mjs 2>&1 | tee refresh.log
          code=${PIPESTATUS[0]}
          set -e

          # The pipeline's exit code is the contract:
          #   0 = validated and rebuilt, safe to publish
          #   2 = rejected by validation, nothing was changed on purpose
          #   1 = crashed
          case $code in
            0) status=published ;;
            2) status=rejected ;;
            *) status=crashed ;;
          esac
          echo "status=$status" >> "$GITHUB_OUTPUT"

          {
            echo "### Refresh: \`$status\`"
            echo ""
            echo '```'
            tail -30 refresh.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # A rejected refresh is a successful defence, not a build failure --
          # the guard did its job and the live page was left alone. Only a
          # crash should go red.
          if [ "$status" = "crashed" ]; then exit 1; fi

      # The ER note is generated only from a snapshot that passed validation --
      # writing commentary on data the pipeline just rejected would put a
      # confident narrative on top of numbers we do not trust.
      - name: Generate ER daily note
        if: steps.refresh.outputs.status == 'published'
        env:
          # Optional. Without it the deterministic renderer produces the same
          # note structure from the data alone, so CI never fails for want of a
          # secret. Add it under Settings > Secrets > Actions to enable the
          # orchestrator-worker synthesis.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          python scripts/build_briefing.py 2>&1 | tee briefing.log
          code=${PIPESTATUS[0]}
          set -e
          {
            echo "### Briefing"
            echo ""
            echo '```'
            tail -20 briefing.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # A failed briefing must not block the market-data commit or the
          # deploy: the page and the numbers are the primary artifact, and the
          # note is commentary on top of them.
          if [ $code -ne 0 ]; then echo "::warning::briefing generation failed (exit $code); keeping previous note"; fi

      - name: Commit daily closes
        if: steps.refresh.outputs.status == 'published'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "refresh: daily closes ${{ github.run_id }} [skip ci]"
          # Only the data the next run needs as its validation baseline, plus
          # the note. out/ is gitignored and ships as a Pages artifact instead.
          file_pattern: data/snapshot.json data/history.json latest_briefing.md
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Upload page
        if: steps.refresh.outputs.status == 'published'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: refresh
    # Skipped when the refresh was rejected: redeploying an unchanged page would
    # only obscure the fact that the data never updated.
    if: needs.refresh.outputs.status == 'published'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
